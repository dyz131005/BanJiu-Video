    async function fetchYamlFile(filename, repo = VIDEO_REPO) {
        const apiKey = decodeApiKey(); if (!apiKey) throw new Error("API Key解码失败");

        if (data.download_url) { const raw = await fetch(data.download_url, { headers: { 'Authorization': `token ${apiKey}` } }); if (raw.ok) return await raw.text(); }
        throw new Error(`无法解析${filename}内容`);
    }
        const __writeLocks = {};
    async function saveYamlFile(filename, content, message, repo = VIDEO_REPO) {
        const apiKey = decodeApiKey(); if (!apiKey) throw new Error("API Key解码失败");
        const url = 'https://api.github.com/repos/' + GITHUB_USERNAME + '/' + repo + '/contents/' + filename;
        const lockKey = repo + '/' + filename;
        const prev = __writeLocks[lockKey] || Promise.resolve();
        const run = prev.then(async function() {
            let lastErr = null;
            for (let attempt = 0; attempt < 5; attempt++) {
                let sha = null;
                try {
                    const ex = await fetch(url, { headers: { 'Authorization': 'token ' + apiKey, 'Accept': 'application/vnd.github.v3+json' }, cache: 'no-store' });
                    if (ex.ok) { const d = await ex.json(); if (d.sha) sha = d.sha; }
                } catch (e) {}
                const body = { message: message, content: btoa(unescape(encodeURIComponent(content))) };

                if (r.ok) return true;
                const t = await r.text();
                if (r.status === 409) { lastErr = new Error('保存' + filename + '失败: 并发冲突(409)'); await new Promise(function(res){ setTimeout(res, 400 + attempt * 350); }); continue; }
                throw new Error('保存' + filename + '失败: ' + r.status + ' - ' + t.substring(0, 120));
            }
            throw lastErr || new Error('保存' + filename + '失败: 409');
        });
        __writeLocks[lockKey] = run.catch(function(){});
        return run;
    }

    function arrayBufferToBase64(buffer) {
        const bytes = new Uint8Array(buffer); let bin = '';
        const cs = 8192;
        for (let i = 0; i < bytes.length; i += cs) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + cs));
        return btoa(bin);
    }
    async function computeGitBlobSha(buffer) {
        const bytes = new Uint8Array(buffer);
        const header = new TextEncoder().encode(`blob ${bytes.length}\0`);
        const combined = new Uint8Array(header.length + bytes.length);
        combined.set(header, 0); combined.set(bytes, header.length);
        const digest = await crypto.subtle.digest('SHA-1', combined);
        return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // ================= 分片上传（参照网盘） =================
    async function uploadChunkToRepo(chunkData, dir, chunkName, idx, total) {
        const apiKey = decodeApiKey(); if (!apiKey) throw new Error("API Key解码失败");
        const filePath = `files/${dir}/${encodeURIComponent(chunkName)}`;
        const url = `https://api.github.com/repos/${GITHUB_USERNAME}/${VIDEO_REPO}/contents/${filePath}`;
        const base64Content = arrayBufferToBase64(chunkData);
        let sha = null;
        try { const ex = await fetch(url, { headers: { 'Authorization': `token ${apiKey}`, 'Accept': 'application/vnd.github.v3+json' } }); if (ex.ok) { const d = await ex.json(); sha = d.sha; } } catch (e) {}
        const body = { message: `上传视频分片: ${chunkName} (${idx + 1}/${total})`, content: base64Content }; if (sha) body.sha = sha;
        const r = await fetch(url, { method: 'PUT', headers: { 'Authorization': `token ${apiKey}`, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });

    }
    async function verifyChunkOnServer(dir, chunkName, expectedSize, expectedBuffer) {
        const apiKey = decodeApiKey(); if (!apiKey) throw new Error("API Key解码失败");
        const url = `https://api.github.com/repos/${GITHUB_USERNAME}/${VIDEO_REPO}/contents/files/${dir}/${encodeURIComponent(chunkName)}`;
        const r = await fetch(url, { headers: { 'Authorization': `token ${apiKey}`, 'Accept': 'application/vnd.github.v3+json' }, cache: 'no-store' });
        if (!r.ok) throw new Error(`验证失败: 服务器返回状态码 ${r.status}`);
        const d = await r.json();
        if (d.type !== 'file') throw new Error(`验证失败: 服务器上未找到 ${chunkName}`);
        if (d.size !== expectedSize) throw new Error(`验证失败: 大小不符（服务器 ${d.size} / 本地 ${expectedSize}）`);
        if (typeof crypto !== 'undefined' && crypto.subtle) {
            try { const es = await computeGitBlobSha(expectedBuffer); if (es !== d.sha) throw new Error('验证失败: 内容校验和不符'); }
            catch (e) { if (e instanceof Error && e.message.indexOf('验证失败') === 0) throw e; }
        }
        return true;
    }
    async function uploadVideoShards(file, dir, onPhase) {
        const ab = await file.arrayBuffer();
        const total = Math.ceil(ab.byteLength / CHUNK_SIZE);
        const base = (file.name.replace(/\.[^/.]+$/, '') || 'video').replace(/[^\w\u4e00-\u9fa5-]/g, '_');
        const names = [];
        for (let i = 0; i < total; i++) {
            const start = i * CHUNK_SIZE, end = Math.min(start + CHUNK_SIZE, ab.byteLength);
            const name = `v_${base}_chunk${i}.bin`;
            names.push(name);
            await uploadChunkToRepo(ab.slice(start, end), dir, name, i, total);
            if (onPhase) onPhase({ type: 'transfer', ratio: (i + 1) / total });
        }
        if (onPhase) onPhase({ type: 'verify' });
        for (let i = 0; i < total; i++) {
            const start = i * CHUNK_SIZE, end = Math.min(start + CHUNK_SIZE, ab.byteLength);
            await verifyChunkOnServer(dir, names[i], end - start, ab.slice(start, end));
        }
        if (onPhase) onPhase({ type: 'verified' });
        return { totalChunks: total, chunkSize: CHUNK_SIZE, storedChunks: names, size: file.size };
    }

    // ================= 下载重建（分片合并） =================
            async function fetchRetry(url, opts, tries) {
        let lastErr;
        for (let i = 0; i < (tries || 3); i++) {
            try {
                const r = await fetch(url, opts);
                return r;
            } catch (e) { lastErr = e; await new Promise(res => setTimeout(res, 500 + i * 400)); }
        }
        throw lastErr || new Error('fetch 失败');
    }
    async function downloadByRange(url, size) {
        const SLICE = 4 * 1024 * 1024;
        const parts = [];
        for (let start = 0; start < size; start += SLICE) {
            const end = Math.min(size - 1, start + SLICE - 1);
            const r = await fetchRetry(url, { headers: { 'Range': 'bytes=' + start + '-' + end } }, 3);
            if (!r.ok) throw new Error('分段下载失败: ' + r.status);
            const b = await r.arrayBuffer();
            if (!b.byteLength) throw new Error('分段下载为空');
            parts.push(new Uint8Array(b));
        }
        const total = parts.reduce((s, p) => s + p.length, 0);
        const out = new Uint8Array(total); let o = 0;
        for (const p of parts) { out.set(p, o); o += p.length; }
        return out.buffer;
    }
    async function downloadChunk(dir, storedName) {
        const apiKey = decodeApiKey(); if (!apiKey) throw new Error("API Key解码失败");
        const url = 'https://api.github.com/repos/' + GITHUB_USERNAME + '/' + VIDEO_REPO + '/contents/files/' + dir + '/' + encodeURIComponent(storedName);
        const r = await fetchRetry(url, { headers: { 'Authorization': 'token ' + apiKey, 'Accept': 'application/vnd.github.v3+json' } }, 3);
        if (!r.ok) throw new Error('获取分片失败: ' + r.status);
        const info = await r.json();
        if (info.type !== 'file') throw new Error('服务器返回的不是文件');
        const size = info.size || 0;
        if (size === 0) return new ArrayBuffer(0);
        if (info.content) { const bs = atob(info.content.replace(/\n/g, '')); const u8 = new Uint8Array(bs.length); for (let i = 0; i < bs.length; i++) u8[i] = bs.charCodeAt(i); return u8.buffer; }
        if (info.download_url) {
            try { return await downloadByRange(info.download_url, size); } catch (e) {}
        }
        if (!info.sha) throw new Error('无法获取分片 blob SHA');
        const blobUrl = 'https://api.github.com/repos/' + GITHUB_USERNAME + '/' + VIDEO_REPO + '/git/blobs/' + info.sha;
        const br = await fetchRetry(blobUrl, { headers: { 'Authorization': 'token ' + apiKey, 'Accept': 'application/vnd.github.v3.raw' } }, 3);
        if (!br.ok) throw new Error('下载分片失败: ' + br.status);
        const ct2 = br.headers.get('content-type') || '';
        if (ct2.indexOf('application/json') !== -1) throw new Error('服务器返回 JSON 而非内容');
        return await br.arrayBuffer();
    }


    async function downloadAndMerge(dir, storedChunks) {
        const parts = [];
        for (const name of storedChunks) { const b = await downloadChunk(dir, name); parts.push(new Uint8Array(b)); }
        const total = parts.reduce((s, p) => s + p.length, 0);
        const out = new Uint8Array(total); let o = 0;
        for (const p of parts) { out.set(p, o); o += p.length; }
        return out.buffer;
    }

    function videoCard(v) {

    // ================= 播放器 + 弹幕 =================
    let _dmSpawned = new Set(); let _dmVideo = null;
    async function initDanmaku(bjId) {
        _dmSpawned = new Set();
        const dm = await loadDanmaku(); const list = (dm[bjId] || []).sort((a, b) => a.time - b.time);
        _dmVideo = $('videoEl'); if (!_dmVideo) return;
        let queue = list.slice();
        _dmVideo.ontimeupdate = () => {
            if (!queue.length) return;
            const t = _dmVideo.currentTime;
            while (queue.length && queue[0].time <= t) {
                const item = queue.shift();
                if (!_dmSpawned.has(item.time + '|' + item.text)) {
                    _dmSpawned.add(item.time + '|' + item.text);
                    spawnDanmaku(item);
                }
            }
        };
    }
    function spawnDanmaku(item) {
        const layer = $('dmbLayer'); if (!layer) return;
        const span = document.createElement('div');
        span.className = 'dmb-item';
        span.textContent = item.text;
        if (item.color) span.style.color = item.color;
        const topPct = 4 + (Math.random() * 26);
        span.style.top = topPct + '%';
        const dur = 6 + Math.random() * 3;
        span.style.setProperty('--dmb-dur', dur + 's');
        layer.appendChild(span);
        requestAnimationFrame(() => { span.classList.add('run'); });
        setTimeout(() => span.remove(), dur * 1000);
    }
    async function sendDanmaku(bjId) {
        if (!currentUser) { toast('请先登录'); openAuth(); return; }
        const input = $('dmbText'); const text = input.value.trim(); if (!text) return;
        const time = _dmVideo ? _dmVideo.currentTime : 0;
        const dm = await loadDanmaku();
        if (!dm[bjId]) dm[bjId] = [];
        dm[bjId].push({ time: Math.round(time * 100) / 100, text, user: currentUser.name, color: '#ffffff' });
        await saveDanmaku(dm);
        // 更新计数
        const d = await loadVideos(); if (d.videos[bjId]) { d.videos[bjId].danmakuCount = (d.videos[bjId].danmakuCount || 0) + 1; await saveVideos(d); }
        input.value = '';
        // 立即发射
        spawnDanmaku({ time, text, user: currentUser.name });
        toast('弹幕已发送');
    }

    // ================= 点赞/硬币/收藏 =================
    async function toggleStat(bjId, kind, btn) {
        if (!currentUser) { toast('请先登录'); openAuth(); return; }
        const saved = JSON.parse(localStorage.getItem('videoStats') || '{}');
        if (!saved[bjId]) saved[bjId] = {};
        const was = saved[bjId][kind];
        const d = await loadVideos(); const v = d.videos[bjId]; if (!v) return;
        const key = { like: 'likeCount', coin: 'coinCount', fav: 'favoriteCount' }[kind];
        if (was) { v[key] = Math.max(0, (v[key] || 0) - 1); delete saved[bjId][kind]; }
        else { v[key] = (v[key] || 0) + 1; saved[bjId][kind] = true; }
        localStorage.setItem('videoStats', JSON.stringify(saved));
        await saveVideos(d);
        btn.classList.toggle('active', !was);
        const svg = btn.querySelector('svg'); if (svg) svg.setAttribute('fill', !was ? 'currentColor' : 'none');
        const label = btn.childNodes[btn.childNodes.length - 1]; if (label) label.textContent = ' ' + v[key];

    async function doUpload() {
        if (!currentUser) { toast('请先登录'); return; }
        const file = $('upFile').files[0]; const title = $('upTitle').value.trim();
        if (!file) { showUp('err', '请选择视频文件'); return; }
        if (!title) { showUp('err', '请填写标题'); return; }
        const slug = $('upPartition').value; const tags = $('upTags').value.split(/[,，]/).map(s => s.trim()).filter(Boolean);
        const desc = $('upDesc').value.trim(); const coverFile = $('upCover').files[0];
        const btn = $('upBtn'); btn.disabled = true;
        $('upProgressBox').classList.remove('hidden');
        showUp('info', '正在准备上传…');
        try {
            const d = await loadVideos();
            const bj = nextBJ(d);
            const dir = bj.replace(/\D/g, ''); // 分片目录 files/<数字>/
            let duration = 0;
            // 读取时长
            try { const url = URL.createObjectURL(file); const tv = document.createElement('video'); tv.preload = 'metadata'; await new Promise((res, rej) => { tv.onloadedmetadata = res; tv.onerror = rej; tv.src = url; }); duration = tv.duration || 0; URL.revokeObjectURL(url); } catch (e) {}
            // 分片上传
            let coverPath = null;
            const shardInfo = await uploadVideoShards(file, dir, (ph) => {
                if (ph.type === 'transfer') { $('upStep').textContent = `分片上传 ${Math.round(ph.ratio * 100)}…`; $('upFill').style.width = Math.round(ph.ratio * 100) + '%'; $('upPct').textContent = Math.round(ph.ratio * 100) + '%'; }
                else if (ph.type === 'verify') { $('upStep').textContent = '正在向服务器验证分片完整性…'; $('upFill').style.width = '99%'; }
                else if (ph.type === 'verified') { $('upStep').textContent = '服务器验证通过'; $('upFill').style.width = '100%'; $('upPct').textContent = '100%'; }
            });
            // 封面（可选）
            if (coverFile) {
                const cbuf = await coverFile.arrayBuffer();
                const cbase = (coverFile.name.replace(/\.[^/.]+$/, '') || 'cover').replace(/[^\w\u4e00-\u9fa5-]/g, '_');
                const cname = `cover_${cbase}.${fileExt(coverFile.name)}`;
                await uploadChunkToRepo(cbuf, dir, cname, 0, 1);
                await verifyChunkOnServer(dir, cname, cbuf.byteLength, cbuf);
                coverPath = `https://raw.githubusercontent.com/${GITHUB_USERNAME}/${VIDEO_REPO}/main/files/${dir}/${encodeURIComponent(cname)}`;
            }
            // 写入 videos.yaml，BJ号递增
            const entry = {
                bj, title, upId: currentUser.username, upName: currentUser.name,
                slug, tags, description: desc, duration: Math.round(duration),
                originalName: file.name, size: file.size,
                storedChunks: shardInfo.storedChunks, totalChunks: shardInfo.totalChunks,
                cover: coverPath, createdAt: new Date().toISOString(),
                viewCount: 0, likeCount: 0, coinCount: 0, favoriteCount: 0, danmakuCount: 0
            };
            d.videos[bj] = entry; d.meta.lastBJ = parseInt(bj.replace(/\D/g, ''), 10);
            await saveVideos(d);
            showUp('ok', `上传成功！你的视频编号：${bj}`);
            setTimeout(() => go('#/video/' + encodeURIComponent(bj)), 800);
        } catch (e) {
            showUp('err', e.message); $('upFill').style.width = '0%';
        } finally { btn.disabled = false; }
    }

    // ================= 路由 =================
    const routes = [
        { re: /^#\/$/, fn: renderHome }, { re: /^#\/c\/([^\/]+)$/, fn: (el, m) => renderPartition(decodeURIComponent(m[1])) },
        { re: /^#\/video\/([^\/]+)$/, fn: (el, m) => renderVideo(decodeURIComponent(m[1])) },
        { re: /^#\/space\/([^\/]*)$/, fn: (el, m) => renderSpace(decodeURIComponent(m[1])) },
        { re: /^#\/upload$/, fn: renderUpload }, { re: /^#\/ranking$/, fn: renderRanking },
        { re: /^#\/search$/, fn: renderSearch }, { re: /^#\/following$/, fn: renderFollowing },
        { re: /^#\/favorites$/, fn: renderFavorites }, { re: /^#\/history$/, fn: renderHistory },
        { re: /^#\/settings$/, fn: renderSettings }, { re: /^#\/messages$/, fn: renderMessages }, { re: /^#\/about$/, fn: renderAbout }
    ];
    function router() {
        const hash = location.hash || '#/';
        if (hash === '#/' || hash === '') { renderHome(); return; }
        for (const r of routes) { const m = hash.match(r.re); if (m) { const fn = r.fn; if (fn.length > 1) { fn(0, m); } else { fn(); } return; } }
        renderHome();
    }

    // ================= 导航 =================
    function buildPartMenu() {
        $('partMenu').innerHTML = PARTITIONS.map(p => `<a class="block rounded-lg px-3 py-1.5 text-sm hover:bg-[var(--bg-soft)]" href="#/c/${p.slug}" style="color:var(--text-1);">${p.name}</a>`).join('');
    }
    function updateAuthUI() {
        const area = $('authArea');
        document.body.classList.toggle('logged-in', !!currentUser);
        if (currentUser) {
            area.innerHTML = `<button class="flex items-center gap-2" onclick="go('#/settings')">${avatarHTML(currentUser.name, 30, currentUser.username)}<span class="text-sm font-medium hidden sm:inline">${escapeHtml(currentUser.name)}</span></button>`;
        } else {
            area.innerHTML = `<div class="flex items-center gap-2"><button class="btn btn-sm btn-ghost" onclick="openAuth()">登录</button><button class="btn btn-sm hidden sm:inline-flex" onclick="openAuth('reg')">注册</button></div>`;
        }
    }
    function openAuth(mode) {
        $('authModal').classList.add('open');
        if (mode === 'reg') switchAuthPanel('reg');
        else switchAuthPanel('login');
    }
    function closeAuth() { $('authModal').classList.remove('open'); }
    function switchAuthPanel(p) {
        document.querySelectorAll('#authModal .tab-btn').forEach(b => b.classList.toggle('active', b.dataset.p === p));
        document.querySelectorAll('#authModal .panel').forEach(x => x.classList.toggle('active', x.id === p + 'Panel'));
    }
    function openProfile() {
        if (!currentUser) { openAuth(); return; }
        $('profileBox').innerHTML = `${avatarHTML(currentUser.name, 48, currentUser.username)}<div><div class="font-bold">${escapeHtml(currentUser.name)}</div><div class="text-sm" style="color:var(--text-3);">@${escapeHtml(currentUser.username)} · ${escapeHtml(currentUser.email)}</div>${currentUser.linkedMain ? `<div class="text-xs mt-1" style="color:var(--brand);">已关联主站账号：${escapeHtml(currentUser.linkedMain)}</div>` : '<div class="text-xs mt-1" style="color:var(--text-3);">未关联主站账号</div>'}</div>`;
        $('linkStatus').className = 'status-box'; $('linkStatus').textContent = ''; $('linkMainInput').value = '';
        $('profileModal').classList.add('open');
    }
    function closeProfile() { $('profileModal').classList.remove('open'); }
    async function doLogin() {
        const b = $('loginStatus'); b.className = 'status-box info'; b.textContent = '登录中…';
        try { const u = await loginUser($('loginUsername').value.trim(), $('loginPassword').value.trim()); currentUser = u; localStorage.setItem('currentUser', JSON.stringify(currentUser)); updateAuthUI(); closeAuth(); router(); toast('登录成功'); }
        catch (e) { b.className = 'status-box err'; b.textContent = e.message; }
    }
    async function doRegister() {
        const b = $('regStatus'); b.className = 'status-box info'; b.textContent = '注册中…';
        try { const u = await registerUser($('regUsername').value.trim(), $('regName').value.trim(), $('regEmail').value.trim(), $('regPassword').value.trim()); currentUser = { ...u, username: $('regUsername').value.trim() }; localStorage.setItem('currentUser', JSON.stringify(currentUser)); updateAuthUI(); closeAuth(); router(); toast('注册成功'); }
        catch (e) { b.className = 'status-box err'; b.textContent = e.message; }
    }
    async function doLinkMain() {
        const b = $('linkStatus'); b.className = 'status-box info'; b.textContent = '关联中…';
        try { const t = await linkMainAccount($('linkMainInput').value, $('linkMainPassword').value); b.className = 'status-box ok'; b.textContent = `已关联主站账号：${t}`; openProfile(); }
        catch (e) { b.className = 'status-box err'; b.textContent = e.message; }
    }
    function doLogout() { currentUser = null; localStorage.removeItem('currentUser'); updateAuthUI(); closeProfile(); router(); toast('已退出登录'); }

    // ================= 初始化 =================
    function refreshStats() {
        loadVideos().then(d => {
            const dc = Object.keys(d.videos).length;
            const dl = $('footStats'); dl.textContent = `稿件 ${dc} · 弹幕 0 · 用户 ${Object.keys(d.videos).length ? Object.keys(d.videos).length : 0} 位UP主`;
        }).catch(() => {});
    }
    function init() {
        buildPartMenu();
        const saved = localStorage.getItem('currentUser');
        if (saved) { try { currentUser = JSON.parse(saved); } catch (e) { localStorage.removeItem('currentUser'); } }
        updateAuthUI();
        loadAvatars().then(() => { updateAuthUI(); router(); });
        refreshStats();
        $('partBtn').addEventListener('click', e => { $('partMenu').classList.toggle('hidden'); e.stopPropagation(); });
        document.addEventListener('click', e => { if (!e.target.closest('#partMenu') && !e.target.closest('#partBtn')) $('partMenu').classList.add('hidden'); });
        $('searchInput').addEventListener('keydown', e => { if (e.key === 'Enter') { const kw = e.target.value.trim(); go('#/search' + (kw ? '?keyword=' + encodeURIComponent(kw) : '')); } });
        window.addEventListener('hashchange', () => { window._incremented = {}; loadAvatars().then(() => router()); });
    }
    init();
    </script>
</body>
</html>
