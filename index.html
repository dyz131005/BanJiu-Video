<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>斑鸠视频 BanJiu Video</title>
    <!-- 站点图标：默认使用仓库根目录的 icon.ico -->
    <link rel="icon" href="icon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    <style>
        :root {
            --bg: #0f1115;
            --bg-soft: #14171c;
            --card: #171a21;
            --card-hover: #1d2129;
            --border: #232833;
            --text: #e8ecf3;
            --text-dim: #9aa3b2;
            --accent: #ff4757;
            --accent-2: #ff7a45;
            --accent-grad: linear-gradient(135deg, #ff4757, #ff7a45);
            --danger: #ff4757;
            --success: #2ed573;
            --radius: 14px;
            --shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
        }
        .container { width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 20px; }

        /* ===== 顶部导航 ===== */
        header {
            position: fixed;
            top: 0; left: 0; width: 100%;
            background: rgba(15, 17, 21, 0.92);
            backdrop-filter: blur(10px);
            padding: 14px 0;
            border-bottom: 1px solid var(--border);
            z-index: 1000;
        }
        nav { display: flex; justify-content: space-between; align-items: center; }
        .logo {
            display: flex; align-items: center; gap: 12px; text-decoration: none;
            font-size: 1.35rem; font-weight: 800; color: var(--text);
        }
        .logo img, .logo .logo-icon { width: 34px; height: 34px; border-radius: 8px; }
        .logo .logo-text b { background: var(--accent-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .nav-right { display: flex; align-items: center; gap: 14px; }
        .nav-link {
            color: var(--text-dim); text-decoration: none; font-weight: 500; font-size: 0.95rem;
            transition: color 0.2s; cursor: pointer; background: none; border: none; font-family: inherit;
        }
        .nav-link:hover { color: var(--text); }

        /* ===== 默认头像：昵称第一个字符的圆形 ===== */
        .avatar-circle {
            width: 40px; height: 40px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-weight: 700; font-size: 1.15rem;
            user-select: none; flex-shrink: 0;
            border: 2px solid rgba(255,255,255,0.15);
        }
        .btn {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 10px 22px; border: none; border-radius: 9px;
            font-weight: 600; font-size: 0.95rem; cursor: pointer;
            background: var(--accent-grad); color: #fff; transition: transform 0.15s, box-shadow 0.15s;
            font-family: inherit;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(255,71,87,0.3); }
        .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
        .btn-ghost:hover { border-color: var(--accent); color: var(--accent); box-shadow: none; }
        .btn-sm { padding: 7px 14px; font-size: 0.85rem; }

        /* ===== Hero ===== */
        .hero {
            min-height: 62vh;
            display: flex; align-items: center; justify-content: center;
            text-align: center; padding: 120px 20px 60px;
            background:
                radial-gradient(1000px 400px at 20% -10%, rgba(255,71,87,0.18), transparent 60%),
                radial-gradient(900px 400px at 80% -10%, rgba(255,122,69,0.14), transparent 60%),
                var(--bg);
            position: relative;
        }
        .hero h1 {
            font-size: 3.2rem; font-weight: 800; line-height: 1.15; margin-bottom: 18px;
        }
        .hero h1 b { background: var(--accent-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .hero p { color: var(--text-dim); font-size: 1.15rem; max-width: 560px; margin: 0 auto 30px; }

        /* ===== 视频区（未实现占位） ===== */
        section.block { padding: 60px 0; }
        .section-title {
            font-size: 1.6rem; font-weight: 700; margin-bottom: 24px;
            display: flex; align-items: center; gap: 12px;
        }
        .section-title .bar { width: 4px; height: 22px; border-radius: 2px; background: var(--accent-grad); }
        .coming-soon {
            border: 2px dashed var(--border); border-radius: var(--radius);
            padding: 60px 30px; text-align: center; color: var(--text-dim);
        }
        .coming-soon i { font-size: 2.6rem; margin-bottom: 16px; display: block; color: var(--accent); }
        .coming-soon h3 { font-size: 1.3rem; color: var(--text); margin-bottom: 8px; }
        .video-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px;
        }
        .video-card {
            background: var(--card); border-radius: var(--radius); overflow: hidden;
            border: 1px solid var(--border); transition: transform 0.2s, box-shadow 0.2s; cursor: pointer;
        }
        .video-card:hover { transform: translateY(-6px); box-shadow: var(--shadow); border-color: #2c3340; }
        .video-thumb { aspect-ratio: 16/9; background: var(--bg-soft); display: flex; align-items: center; justify-content: center; color: var(--text-dim); font-size: 2rem; }
        .video-info { padding: 14px; }
        .video-info h4 { font-size: 0.98rem; font-weight: 600; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .video-info .meta { font-size: 0.82rem; color: var(--text-dim); }

        /* ===== 关于 ===== */
        .about { background: var(--bg-soft); }
        .about p { color: var(--text-dim); max-width: 720px; }

        footer { border-top: 1px solid var(--border); padding: 40px 0; text-align: center; color: var(--text-dim); font-size: 0.9rem; }

        /* ===== 弹窗 ===== */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); z-index: 3000; justify-content: center; align-items: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
            padding: 32px; width: 90%; max-width: 440px; box-shadow: var(--shadow);
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; }
        .modal-header h2 { font-size: 1.4rem; }
        .modal-close { background: none; border: none; font-size: 1.5rem; color: var(--text-dim); cursor: pointer; }
        .modal-close:hover { color: var(--text); }
        .tab-buttons { display: flex; gap: 10px; margin-bottom: 22px; }
        .tab-btn { flex: 1; padding: 11px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text-dim); font-weight: 600; cursor: pointer; font-family: inherit; transition: all 0.15s; }
        .tab-btn.active { background: var(--accent-grad); color: #fff; border-color: transparent; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 7px; font-weight: 500; font-size: 0.9rem; color: var(--text-dim); }
        .form-control {
            width: 100%; padding: 12px 14px; background: var(--bg); color: var(--text);
            border: 1px solid var(--border); border-radius: 8px; font-family: inherit; font-size: 0.95rem;
            transition: border-color 0.2s;
        }
        .form-control:focus { outline: none; border-color: var(--accent); }
        .btn-block { width: 100%; justify-content: center; margin-top: 6px; }
        .feedback-status { display: none; padding: 11px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 0.9rem; font-weight: 600; text-align: center; }
        .feedback-status.success { display: block; background: rgba(46,213,115,0.14); color: var(--success); border: 1px solid rgba(46,213,115,0.3); }
        .feedback-status.error { display: block; background: rgba(255,71,87,0.14); color: var(--danger); border: 1px solid rgba(255,71,87,0.3); }
        .feedback-status.info { display: block; background: rgba(90,140,255,0.14); color: #5a8cff; border: 1px solid rgba(90,140,255,0.3); }

        /* 个人中心 */
        .profile-box { display: flex; align-items: center; gap: 16px; padding: 18px; background: var(--bg); border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; }
        .profile-box .avatar-circle { width: 56px; height: 56px; font-size: 1.5rem; }
        .profile-name { font-size: 1.15rem; font-weight: 700; }
        .profile-meta { font-size: 0.85rem; color: var(--text-dim); margin-top: 2px; }
        .linked-badge { display: inline-block; padding: 3px 10px; border-radius: 20px; background: rgba(46,213,115,0.15); color: var(--success); font-size: 0.8rem; font-weight: 600; margin-top: 6px; }
        .link-row { display: flex; gap: 10px; }

        .loading-small { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(0,0,0,0.15); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 8px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            .hero h1 { font-size: 2.2rem; }
            .video-grid { grid-template-columns: 1fr 1fr; }
        }
        @media (max-width: 520px) {
            .video-grid { grid-template-columns: 1fr; }
            .nav-right .nav-link.hide-sm { display: none; }
        }
    </style>
</head>
<body>

    <header>
        <div class="container">
            <nav>
                <a href="#" class="logo" id="logoLink">
                    <img src="icon.ico" alt="logo" class="logo-icon" onerror="this.style.display='none'">
                    <span class="logo-text"><b>斑鸠视频</b> BanJiu</span>
                </a>
                <div class="nav-right">
                    <a href="#video" class="nav-link">视频</a>
                    <a href="#about" class="nav-link hide-sm">关于</a>
                    <span id="authArea">
                        <!-- 未登录：登录/注册按钮；已登录：头像+昵称 -->
                    </span>
                </div>
            </nav>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="container">
                <h1>欢迎来到 <b>斑鸠视频</b></h1>
                <p>斑鸠OS 生态下的弹幕视频社区，账号可关联主网站账号。</p>
                <button class="btn" id="heroAuthBtn">登录 / 注册</button>
            </div>
        </section>

        <section class="block" id="video">
            <div class="container">
                <div class="section-title"><span class="bar"></span> 视频列表</div>
                <div class="coming-soon">
                    <i class="fas fa-film"></i>
                    <h3>视频功能建设中</h3>
                    <p>播放、上传、弹幕等功能尚未实现，敬请期待。</p>
                </div>
            </div>
        </section>

        <section class="block about" id="about">
            <div class="container">
                <div class="section-title"><span class="bar"></span> 关于本站</div>
                <p>斑鸠视频（BanJiu Video）是一个基于 GitHub 存储的弹幕视频社区。本站账号体系独立，可关联你已有的主网站账号，关联后主网站账号与本站账号互通标识。</p>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>斑鸠视频 BanJiu Video · 数据存储于 <b>github.com/dyz131005/BanJiu-Video</b></p>
            <p style="margin-top:6px;">© 2026 斑鸠工作室</p>
        </div>
    </footer>

    <!-- 登录 / 注册弹窗 -->
    <div class="modal" id="authModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fas fa-user-circle"></i> 账户</h2>
                <button class="modal-close" id="closeAuthModal">&times;</button>
            </div>
            <div class="tab-buttons">
                <button class="tab-btn active" data-tab="login">登录</button>
                <button class="tab-btn" data-tab="register">注册</button>
            </div>
            <div class="tab-content active" id="loginTab">
                <div class="feedback-status" id="loginStatus"></div>
                <form id="loginForm">
                    <div class="form-group">
                        <label>用户名</label>
                        <input type="text" id="loginUsername" class="form-control" placeholder="请输入本站用户名" required>
                    </div>
                    <div class="form-group">
                        <label>密码</label>
                        <input type="password" id="loginPassword" class="form-control" placeholder="请输入密码" required>
                    </div>
                    <button type="submit" class="btn btn-block">登录</button>
                </form>
            </div>
            <div class="tab-content" id="registerTab">
                <div class="feedback-status" id="registerStatus"></div>
                <form id="registerForm">
                    <div class="form-group">
                        <label>用户名</label>
                        <input type="text" id="regUsername" class="form-control" placeholder="本站登录用户名" required>
                    </div>
                    <div class="form-group">
                        <label>昵称（头像默认取第一个字）</label>
                        <input type="text" id="regName" class="form-control" placeholder="例如：斑鸠" required>
                    </div>
                    <div class="form-group">
                        <label>邮箱</label>
                        <input type="email" id="regEmail" class="form-control" placeholder="请输入邮箱" required>
                    </div>
                    <div class="form-group">
                        <label>密码</label>
                        <input type="password" id="regPassword" class="form-control" placeholder="请输入密码" required>
                    </div>
                    <button type="submit" class="btn btn-block">注册</button>
                </form>
            </div>
        </div>
    </div>

    <!-- 个人中心 / 关联主站账号弹窗 -->
    <div class="modal" id="profileModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fas fa-id-card"></i> 个人中心</h2>
                <button class="modal-close" id="closeProfileModal">&times;</button>
            </div>
            <div class="profile-box" id="profileBox"></div>
            <div class="feedback-status" id="linkStatus"></div>
            <div class="form-group">
                <label>关联主网站账号（输入主网站用户名）</label>
                <div class="link-row">
                    <input type="text" id="linkMainInput" class="form-control" placeholder="例如：dyz">
                    <button class="btn btn-sm" id="linkMainBtn"><i class="fas fa-link"></i> 关联</button>
                </div>
            </div>
            <button class="btn btn-ghost btn-block" id="logoutBtn">退出登录</button>
        </div>
    </div>

    <script>
        // ============ 常量 ============
        const ENCODED_API_KEY = "V分2分p分K分c分0分1分H分R分k分l分W分b分W分x分Z分T分T分B分K分b分1分p分F分W分T分R分l分R分T分F分W分U分2分s分5分V分F分Z分U分V分l分p分V分M分n分h分G分Z分D分F分a分S分W分J分6分U分l分Z分i分S分E分E分w分V分l分V分V分M分W分E分y分U分l分h分a分R分V分Z分Z分T分U分Z分a分S分1分Z分X分e分G分9分X分R0分5分W分V分W分x分K分U0分1分F分c分G分F分Z分M分V分Z分3分U分l分U分x分c分k分9分U分U分m分x分i分V分G分x分Z分W分V分d分w分Y分V分N分X分T分n分V分X分b分X分R分U分V分l分h分o分a分F分l分V分V分l分d分X分b分E5分W分Z分U分Z分k分U分m分J分H分a分D分N分a分R分V分J分h分V0分d分W分W分F分R分U分S分l分V分h分e分m分x分o分V分F分R分C分U1分Z分W分R分n分V分X分b分T分F分V分Y分m分x分a分R分F分R分s分V分m分t分k分Q分T0分9";
        const GITHUB_USERNAME = "dyz131005";
        const VIDEO_REPO = "BanJiu-Video";          // 本站所有配置/账号存储仓库
        const MAIN_REPO = "dyz131005.github.io";    // 主网站仓库（用于关联主站账号）
        const ACCOUNTS_FILE = "accounts.yaml";

        let currentUser = null;

        // ============ 工具 ============
        function decodeApiKey() {
            try {
                const withoutFen = ENCODED_API_KEY.replace(/分/g, '');
                return atob(atob(atob(withoutFen)));
            } catch (e) { console.error("API Key解码失败:", e); return null; }
        }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        // 默认头像：昵称第一个字符 + 由昵称哈希决定颜色的圆形
        function avatarHTML(name) {
            const s = String(name || '?').trim();
            const ch = escapeHtml(s.charAt(0) || '?');
            let hue = 0;
            for (let i = 0; i < s.length; i++) hue = (hue * 31 + s.charCodeAt(i)) % 360;
            return `<div class="avatar-circle" style="background: hsl(${hue},72%,48%);">${ch}</div>`;
        }

        async function fetchYamlFile(filename, repo = VIDEO_REPO) {
            const apiKey = decodeApiKey();
            if (!apiKey) throw new Error("API Key解码失败");
            const url = `https://api.github.com/repos/${GITHUB_USERNAME}/${repo}/contents/${filename}`;
            const response = await fetch(url, {
                headers: { 'Authorization': `token ${apiKey}`, 'Accept': 'application/vnd.github.v3+json' }
            });
            if (response.status === 404) return null;
            if (!response.ok) throw new Error(`获取${filename}失败: ${response.status}`);
            const ct = response.headers.get('content-type') || '';
            if (ct.includes('raw')) return await response.text();
            const data = await response.json();
            if (data.encoding === 'base64' && data.content) {
                const bin = atob(data.content.replace(/\n/g, ''));
                const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
                return new TextDecoder().decode(bytes);
            }
            if (data.download_url) {
                const raw = await fetch(data.download_url, { headers: { 'Authorization': `token ${apiKey}` } });
                if (raw.ok) return await raw.text();
            }
            throw new Error(`无法解析${filename}的内容`);
        }

        async function saveYamlFile(filename, content, message, repo = VIDEO_REPO) {
            const apiKey = decodeApiKey();
            if (!apiKey) throw new Error("API Key解码失败");
            const url = `https://api.github.com/repos/${GITHUB_USERNAME}/${repo}/contents/${filename}`;
            let sha = null;
            const existing = await fetch(url, {
                headers: { 'Authorization': `token ${apiKey}`, 'Accept': 'application/vnd.github.v3+json' },
                cache: 'no-store'
            });
            if (existing.ok) { const d = await existing.json(); if (d.sha) sha = d.sha; }
            const base64 = btoa(unescape(encodeURIComponent(content)));
            const body = { message: message, content: base64 };
            if (sha) body.sha = sha;
            const response = await fetch(url, {
                method: 'PUT',
                headers: { 'Authorization': `token ${apiKey}`, 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            if (!response.ok) {
                const t = await response.text();
                throw new Error(`保存${filename}失败: ${response.status} - ${t.substring(0, 120)}`);
            }
            return true;
        }

        // ============ 账号体系（本站独立，存储于 BanJiu-Video/accounts.yaml） ============
        async function loadAccounts() {
            try {
                const content = await fetchYamlFile(ACCOUNTS_FILE, VIDEO_REPO);
                if (!content) return {};
                return jsyaml.load(content) || {};
            } catch (e) { console.error("加载本站账号失败:", e); return {}; }
        }

        async function saveAccounts(accounts) {
            await saveYamlFile(ACCOUNTS_FILE, jsyaml.dump(accounts), '更新斑鸠视频账号', VIDEO_REPO);
        }

        async function registerUser(username, name, email, password) {
            const accounts = await loadAccounts();
            if (accounts[username]) throw new Error("用户名已存在");
            accounts[username] = {
                name: name,
                email: email,
                password: password,
                createdAt: new Date().toISOString()
            };
            await saveAccounts(accounts);
            return accounts[username];
        }

        async function loginUser(username, password) {
            const accounts = await loadAccounts();
            const acc = accounts[username];
            if (!acc) throw new Error("用户不存在");
            if (acc.password !== password) throw new Error("密码错误");
            return { ...acc, username: username };
        }

        // 校验主网站账号是否存在
        async function mainUserExists(mainUsername) {
            try {
                const content = await fetchYamlFile(ACCOUNTS_FILE, MAIN_REPO);
                if (!content) return false;
                const accounts = jsyaml.load(content) || {};
                return !!accounts[mainUsername];
            } catch (e) { return false; }
        }

        // 关联主网站账号（输入主网站用户名）
        async function linkMainAccount(mainUsername) {
            if (!currentUser) throw new Error("请先登录本站账号");
            const target = (mainUsername || '').trim();
            if (!target) throw new Error("请输入主网站用户名");
            const exists = await mainUserExists(target);
            if (!exists) throw new Error(`主网站用户 ${target} 不存在`);
            const accounts = await loadAccounts();
            accounts[currentUser.username].linkedMain = target;
            await saveAccounts(accounts);
            currentUser.linkedMain = target;
            localStorage.setItem('currentUser', JSON.stringify(currentUser));
            return target;
        }

        // ============ UI ============
        function showStatus(id, msg, type) {
            const el = document.getElementById(id);
            el.textContent = msg;
            el.className = `feedback-status ${type}`;
        }

        function updateAuthUI() {
            const area = document.getElementById('authArea');
            if (currentUser) {
                area.innerHTML = `
                    <button class="nav-link" id="headerProfileBtn" style="display:flex;align-items:center;gap:8px;">
                        ${avatarHTML(currentUser.name)}
                        <span>${escapeHtml(currentUser.name)}</span>
                    </button>
                `;
                document.getElementById('headerProfileBtn').addEventListener('click', openProfileModal);
                document.getElementById('heroAuthBtn').style.display = 'none';
            } else {
                area.innerHTML = `<button class="btn btn-sm" id="headerAuthBtn"><i class="fas fa-user"></i> 登录 / 注册</button>`;
                document.getElementById('headerAuthBtn').addEventListener('click', openAuthModal);
                document.getElementById('heroAuthBtn').style.display = 'inline-flex';
            }
        }

        function openAuthModal() { document.getElementById('authModal').classList.add('active'); }
        function closeAuthModal() {
            document.getElementById('authModal').classList.remove('active');
            document.getElementById('loginForm').reset();
            document.getElementById('registerForm').reset();
            document.getElementById('loginStatus').style.display = 'none';
            document.getElementById('registerStatus').style.display = 'none';
        }

        function openProfileModal() {
            const box = document.getElementById('profileBox');
            box.innerHTML = `
                ${avatarHTML(currentUser.name)}
                <div>
                    <div class="profile-name">${escapeHtml(currentUser.name)}</div>
                    <div class="profile-meta">@${escapeHtml(currentUser.username)} · ${escapeHtml(currentUser.email)}</div>
                    ${currentUser.linkedMain
                        ? `<span class="linked-badge"><i class="fas fa-link"></i> 已关联主站账号：${escapeHtml(currentUser.linkedMain)}</span>`
                        : `<span class="linked-badge" style="background:rgba(255,71,87,0.14);color:var(--danger);"><i class="fas fa-unlink"></i> 未关联主站账号</span>`}
                </div>
            `;
            document.getElementById('linkStatus').style.display = 'none';
            document.getElementById('linkMainInput').value = '';
            document.getElementById('profileModal').classList.add('active');
        }
        function closeProfileModal() { document.getElementById('profileModal').classList.remove('active'); }

        function logout() {
            currentUser = null;
            localStorage.removeItem('currentUser');
            updateAuthUI();
        }

        // ============ 事件绑定 ============
        document.getElementById('heroAuthBtn').addEventListener('click', openAuthModal);
        document.getElementById('closeAuthModal').addEventListener('click', closeAuthModal);
        document.getElementById('authModal').addEventListener('click', function (e) { if (e.target === this) closeAuthModal(); });
        document.getElementById('closeProfileModal').addEventListener('click', closeProfileModal);
        document.getElementById('profileModal').addEventListener('click', function (e) { if (e.target === this) closeProfileModal(); });

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function () {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                this.classList.add('active');
                document.getElementById(this.dataset.tab + 'Tab').classList.add('active');
            });
        });

        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            showStatus('loginStatus', '登录中...', 'info');
            try {
                const user = await loginUser(username, password);
                currentUser = user;
                localStorage.setItem('currentUser', JSON.stringify(currentUser));
                updateAuthUI();
                closeAuthModal();
            } catch (error) {
                showStatus('loginStatus', error.message, 'error');
            }
        });

        document.getElementById('registerForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const username = document.getElementById('regUsername').value.trim();
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value.trim();
            showStatus('registerStatus', '注册中...', 'info');
            try {
                const user = await registerUser(username, name, email, password);
                currentUser = { ...user, username: username };
                localStorage.setItem('currentUser', JSON.stringify(currentUser));
                updateAuthUI();
                closeAuthModal();
            } catch (error) {
                showStatus('registerStatus', error.message, 'error');
            }
        });

        document.getElementById('linkMainBtn').addEventListener('click', async function () {
            const btn = this;
            const input = document.getElementById('linkMainInput');
            showStatus('linkStatus', '关联中...', 'info');
            btn.disabled = true;
            try {
                const linked = await linkMainAccount(input.value);
                showStatus('linkStatus', `已关联主站账号：${linked}`, 'success');
                input.value = '';
                openProfileModal(); // 刷新个人中心
            } catch (error) {
                showStatus('linkStatus', error.message, 'error');
            } finally {
                btn.disabled = false;
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', function () {
            logout();
            closeProfileModal();
        });

        // 恢复登录态
        const savedUser = localStorage.getItem('currentUser');
        if (savedUser) {
            try {
                currentUser = JSON.parse(savedUser);
            } catch (e) { localStorage.removeItem('currentUser'); }
        }
        updateAuthUI();
    </script>
</body>
</html>
